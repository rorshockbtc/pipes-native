[package]
name = "app"
version = "0.1.0"
description = "Pipes Sovereign Desktop Node"
authors = ["Pipes Protocol"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
tokio = "1.53.1"
dirs = "7.0.0"
lazy_static = "1.5.0"
notify = "8.2.0"
regex = "1.11"
