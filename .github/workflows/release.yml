name: Desktop release

# Builds installers for macOS (Apple Silicon and Intel) and Windows and attaches
# them to a GitHub Release. Push a tag like v0.1.1 to run it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - os: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - os: windows-latest
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set these repository secrets to sign and notarize macOS builds.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Pipes Desktop ${{ github.ref_name }}'
          releaseBody: |
            ## Pipes Desktop ${{ github.ref_name }}

            **Three Sovereign Workstations in One `<15MB` Native Binary:**
            - **Curator Mode** (`/curate`): Personal reading desk, Merkle-verified knowledge base, and local Ollama synthesis.
            - **Marigold Data & Civic Studio** (`/desktop/marigold`): Native Rust `O(1)` out-of-core `.zip`, `.tsv`, `.txt`, and `.csv` streaming profiler & 250k-row Merkle sharder (`~/Documents/Marigold_Local`) bypassing browser WebAssembly's 4 GB limit.
            - **Bang Studio** (`/desktop/bang`): Local AI IDE, zero-cloud code harness, and workspace terminal.

            ### Downloads
            - **macOS (Apple Silicon M1–M4)**: `Pipes_0.1.1_aarch64.dmg`
            - **macOS (Intel)**: `Pipes_0.1.1_x64.dmg`
            - **Windows (x64)**: `Pipes_0.1.1_x64-setup.exe` or `.msi`

            > Unsigned preview build. On macOS open **System Settings > Privacy & Security** and choose **Open Anyway** (or right-click `Pipes.app` -> **Open**) the first time. On Windows choose **More info > Run anyway** if SmartScreen appears.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
