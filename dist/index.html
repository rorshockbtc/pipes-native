<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pipes Sovereign Studio</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #FAF8F5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #111827;
    }
    .loader {
      width: 48px;
      height: 48px;
      border: 3px solid #E2DBD0;
      border-top-color: #FF1777;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 13px;
      color: #6B7280;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="loader"></div>
  <h1>Connecting to Pipes Sovereign Network</h1>
  <p>Initializing desktop node and local AI runtime...</p>
  <script>
    // Redirect to production web app or fallback to local dev
    const target = window.location.protocol === 'http:' && window.location.port === '3000'
      ? 'http://localhost:3000/desktop/bang'
      : 'https://www.pipes.pink/desktop/bang';
    
    // Check if network is available
    fetch('https://www.pipes.pink/api/health', { mode: 'no-cors', cache: 'no-store' })
      .then(() => {
        window.location.replace(target);
      })
      .catch(() => {
        // Fallback to local or retry
        window.location.replace(target);
      });
  </script>
</body>
</html>
